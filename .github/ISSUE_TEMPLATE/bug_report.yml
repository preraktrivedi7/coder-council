name: Bug report
description: Report a reproducible Coder Council problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Remove credentials and private project data from all output.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Paste `coder-council doctor` output. Do not include secrets.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22, VS Code 1.100, Coder Council 0.3.0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, OAuth tokens, cookies, and private repository data.
          required: true
